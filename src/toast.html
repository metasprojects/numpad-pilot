<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: dark; font-family: -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { display: flex; align-items: center; justify-content: center; }
    .pill {
      width: 238px; height: 64px; display: flex; align-items: center; gap: 12px; padding: 9px 13px;
      color: #fff; background: rgba(29, 31, 36, .88); border: 1px solid rgba(255, 255, 255, .19);
      border-radius: 19px; box-shadow: 0 10px 28px rgba(0, 0, 0, .28), inset 0 1px rgba(255, 255, 255, .09);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      opacity: 0; transform: translateX(36px) scale(.94);
    }
    .pill.enter { animation: arrive 420ms cubic-bezier(.18, 1.2, .32, 1) forwards; }
    .pill.leave { animation: depart 300ms ease-in forwards; }
    .icon { flex: 0 0 42px; width: 42px; height: 42px; display: grid; place-items: center;
      border-radius: 14px; background: linear-gradient(145deg, #ff737b, #e84462); }
    .icon svg { width: 23px; height: 23px; fill: #fff; stroke: none; }
    .pill.unlike .icon { background: rgba(255, 255, 255, .13); }
    .pill.unlike .icon svg { fill: none; stroke: #fff; stroke-width: 1.8; }
    .pill.comment .icon { background: linear-gradient(145deg, #86a9ff, #5379e8); }
    .pill.comment .icon svg { fill: none; stroke: #fff; stroke-width: 1.8; stroke-linejoin: round; }
    .pill.share .icon { background: linear-gradient(145deg, #74cfdd, #438db5); }
    .pill.share .icon svg { fill: none; stroke: #fff; stroke-width: 1.8; stroke-linejoin: round; }
    .title { display: block; font-size: 16px; font-weight: 700; line-height: 1.2; letter-spacing: -.025em; }
    .subtitle { display: block; margin-top: 3px; color: rgba(255, 255, 255, .65); font-size: 11px; }
    @keyframes arrive { 0% { opacity: 0; transform: translateX(36px) scale(.94); }
      68% { opacity: 1; transform: translateX(-4px) scale(1.02); }
      100% { opacity: 1; transform: translateX(0) scale(1); } }
    @keyframes depart { from { opacity: 1; transform: translateX(0) scale(1); }
      to { opacity: 0; transform: translateX(26px) scale(.97); } }
    @media (prefers-reduced-motion: reduce) {
      .pill.enter { animation: appear 120ms ease-out forwards; }
      .pill.leave { animation: disappear 120ms ease-in forwards; }
      @keyframes appear { to { opacity: 1; transform: none; } }
      @keyframes disappear { to { opacity: 0; transform: none; } }
    }
  </style>
</head>
<body>
  <div id="pill" class="pill" role="status" aria-live="polite">
    <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="shape" d="M12 21.1 3.6 13.2A5.4 5.4 0 0 1 11.8 6l.2.2.2-.2a5.4 5.4 0 0 1 8.2 7.2L12 21.1Z"/></svg></span>
    <span><span id="title" class="title">Liked</span><span id="subtitle" class="subtitle">Instagram Reel</span></span>
  </div>
  <script>
    const pill = document.getElementById('pill');
    const title = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');
    const shape = document.getElementById('shape');
    const heart = 'M12 21.1 3.6 13.2A5.4 5.4 0 0 1 11.8 6l.2.2.2-.2a5.4 5.4 0 0 1 8.2 7.2L12 21.1Z';
    window.renderToast = (action, changed) => {
      const liked = action === 'like';
      if (action === 'comment') {
        title.textContent = changed ? 'Comment ready' : 'Comment view open';
        subtitle.textContent = 'Type in Instagram';
        shape.setAttribute('d', 'M4 5.5h16v11H9l-5 4v-15Z');
      } else if (action === 'share') {
        title.textContent = 'Send options';
        subtitle.textContent = 'Choose in Instagram';
        shape.setAttribute('d', 'M3 11.5 21 3l-6 18-3.5-7L3 11.5Zm8.5 2.5L21 3');
      } else {
        title.textContent = changed ? liked ? 'Liked' : 'Unliked' : liked ? 'Already liked' : 'Not liked';
        subtitle.textContent = 'Instagram Reel';
        shape.setAttribute('d', heart);
      }
      pill.className = `pill${action === 'like' ? '' : ` ${action === 'unlike' ? 'unlike' : action}`}`;
      void pill.offsetWidth;
      pill.classList.add('enter');
    };
    window.dismissToast = () => { pill.classList.remove('enter'); pill.classList.add('leave'); };
  </script>
</body>
</html>
